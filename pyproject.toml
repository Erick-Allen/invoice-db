[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-db"
version = "0.17.0"
authors = [{name = "Erick Allen" }]
description = "A relational database, CLI, API, and frontend application for managing customers, invoices, and products with SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "django>=5.2.13",
    "djangorestframework>=3.17.1",
    "django-cors-headers>=4.9.0",
    "pydantic>=2.13.4",
    "scikit-learn==1.8.0",
    "joblib>=1.5.3",
    "rapidfuzz>=3.14.5",
    "ollama>=0.6.2",
]

[project.scripts]
invoicedb = "invoice_db.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "server.settings"
python_files = ["tests.py", "test_*.py"]

[tool.setuptools.packages.find]
include = ["invoice_db*", "api*", "server*"]
